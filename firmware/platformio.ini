; PlatformIO configuration for the LANCET heater firmware.
; Use `pio run -t upload` to compile and flash, then `pio device monitor`
; for serial logs.

[platformio]
default_envs = uno
src_dir = .

[env:uno]
platform   = atmelavr
board      = uno
framework  = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_deps =
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.9.0

; The Arduino IDE uses .ino as the entry point; PlatformIO compiles it via
; the Arduino framework's preprocessor, so no separate .cpp is needed.
